components:
  schemas:
    AbstractNotificationMessage:
      type: object
      description: "Typed notification message; its discriminator selects email, push,\
        \ or another installed message subtype."
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
    AgentDescriptor:
      type: object
      allOf:
      - $ref: "#/components/schemas/AssetDescriptorObject"
      - type: object
        properties:
          agentLinkType:
            type: string
          assetDiscovery:
            type: boolean
          assetImport:
            type: boolean
    AgentObjectObjectObject:
      type: object
      properties:
        accessPublicRead:
          type: boolean
          description: Allows anonymous callers to read this asset where an endpoint
            supports public access.
          example: false
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AttributeObject"
          description: "Attributes keyed by attribute name. Each entry contains type,\
            \ value, timestamp, and optional metadata."
          properties:
            delegate:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/AttributeObject"
        createdOn:
          type: string
          format: date-time
          description: Server-assigned asset creation time.
          example: 2026-01-01T00:00:00Z
          readOnly: true
        id:
          type: string
          description: Stable 22-character asset identifier. Omit when creating an
            asset.
          example: 7A6p4AnLTkKxJUCQAAABAA
          pattern: "^[0-9A-Za-z]{22}$"
        name:
          type: string
          description: Human-readable asset name.
          example: Boiler room sensor
          maxLength: 1023
          minLength: 1
        parentId:
          type: string
          description: Parent asset identifier. Omit for a root asset.
          example: 1ZyG7BmsTQ2cGmbuaMsi0A
          pattern: "^[0-9A-Za-z]{22}$"
        path:
          type: array
          description: Ancestor identifiers from the root through the parent.
          items:
            type: string
            description: Ancestor identifiers from the root through the parent.
            readOnly: true
          readOnly: true
        realm:
          type: string
          description: Realm that owns the asset; immutable after creation.
          example: building
          maxLength: 255
          minLength: 1
        type:
          type: string
          description: Registered asset subtype discriminator.
          example: ThingAsset
        version:
          type: integer
          format: int64
          description: Optimistic-lock version. Omit when creating an asset and preserve
            the latest value when updating it.
          example: 3
          minimum: 0
      required:
      - name
      - realm
    Alarm:
      type: object
      description: Operational alarm submitted to or returned by the alarm service.
      properties:
        assigneeId:
          type: string
          description: Identity-provider user assigned to handle the alarm.
          example: 2f1c17e5-72b8-4dbe-9f8d-c49e66f82e10
        content:
          type: string
          description: Detailed alarm message.
          example: Boiler room temperature reached 42 °C.
        realm:
          type: string
          description: Realm that owns the alarm.
          example: building
        severity:
          type: string
          description: Operational impact of the alarm.
          enum:
          - LOW
          - MEDIUM
          - HIGH
        source:
          type: string
          description: Kind of actor that created the alarm.
          enum:
          - MANUAL
          - CLIENT
          - GLOBAL_RULESET
          - REALM_RULESET
          - ASSET_RULESET
          - AGENT
          readOnly: true
        sourceId:
          type: string
          description: "Identifier of the rule, user, or system component that created\
            \ the alarm."
          readOnly: true
        status:
          type: string
          description: Current alarm workflow state.
          enum:
          - OPEN
          - ACKNOWLEDGED
          - IN_PROGRESS
          - RESOLVED
          - CLOSED
        title:
          type: string
          description: Short human-readable alarm title.
          example: Temperature threshold exceeded
      required:
      - realm
      - severity
      - source
      - sourceId
      - status
      - title
    AlarmAssetLink:
      type: object
      properties:
        assetName:
          type: string
        createdOn:
          type: string
          format: date-time
        id:
          $ref: "#/components/schemas/Id"
        parentAssetName:
          type: string
    AllowedValues:
      type: object
      allOf:
      - $ref: "#/components/schemas/ValueConstraint"
      - type: object
        properties:
          allowedValueNames:
            type: array
            items:
              type: string
          allowedValues:
            type: array
            items:
              type: object
    ArrayPredicate:
      type: object
      allOf:
      - $ref: "#/components/schemas/ValuePredicate"
      - type: object
        properties:
          index:
            type: integer
            format: int32
          lengthEquals:
            type: integer
            format: int32
          lengthGreaterThan:
            type: integer
            format: int32
          lengthLessThan:
            type: integer
            format: int32
          negated:
            type: boolean
          value:
            type: object
    AssetConditions:
      type: object
      properties:
        access:
          type: array
          items:
            type: string
            enum:
            - RESTRICTED
            - LINKED
            - REALM
        minAmount:
          type: string
          enum:
          - AT_LEAST_ONE
          - ALL
          - NONE
        parents:
          type: array
          items:
            $ref: "#/components/schemas/ParentPredicate"
    AssetDatapointAllQuery:
      type: object
      allOf:
      - $ref: "#/components/schemas/AssetDatapointQuery"
      description: "Returns every stored datapoint in the inclusive range, ordered\
        \ from newest to oldest. Use this when the complete series is needed without\
        \ aggregation or downsampling. Supports numeric, boolean, text, and JSON-compatible\
        \ complex attribute values."
    AssetDatapointIntervalQuery:
      type: object
      allOf:
      - $ref: "#/components/schemas/AssetDatapointQuery"
      - type: object
        properties:
          formula:
            type: string
            description: "Aggregation applied per bucket: `MIN`, `AVG`, and `MAX`\
              \ calculate the corresponding value; `DIFFERENCE` calculates the change\
              \ between the last values of consecutive buckets; `COUNT` counts datapoints;\
              \ `SUM` totals numeric values (or true values for booleans); `MODE`\
              \ selects the most frequent value; and `MEDIAN` selects the middle value.\
              \ `DIFFERENCE` is numeric only."
            enum:
            - MIN
            - AVG
            - MAX
            - DIFFERENCE
            - COUNT
            - SUM
            - MODE
            - MEDIAN
          gapFill:
            type: boolean
            description: "When true, returns empty buckets across the requested range\
              \ using time-bucket gap filling; their aggregate is generally null.\
              \ When false, only buckets containing datapoints are returned. Defaults\
              \ to false."
            example: true
          interval:
            type: string
            description: "PostgreSQL interval literal that sets the bucket width.\
              \ Include a positive amount and unit, for example `1 hour`, `5 minutes`,\
              \ or `1 day`."
            example: 1 hour
      description: Aggregates numeric or boolean datapoints from the inclusive range
        into aligned time buckets and returns buckets in chronological order. Use
        this to summarize a series at a regular resolution. Numeric attributes support
        every formula; boolean attributes support every formula except `DIFFERENCE`
        and are aggregated as 1 for true and 0 for false.
      required:
      - formula
      - interval
    AssetDatapointLTTBQuery:
      type: object
      allOf:
      - $ref: "#/components/schemas/AssetDatapointQuery"
      - type: object
        properties:
          amountOfPoints:
            type: integer
            format: int32
            description: Requested maximum number of representative datapoints after
              downsampling. Fewer points are returned when the range contains fewer
              datapoints.
            example: 500
      description: Downsamples numeric or boolean datapoints from the inclusive range
        with the Largest-Triangle-Three-Buckets (LTTB) algorithm while preserving
        the series' visual shape. Use this to reduce a large series for charts. Results
        are chronological; boolean values are processed as 1 for true and 0 for false.
        Other attribute value types are rejected.
      required:
      - amountOfPoints
    AssetDatapointNearestQuery:
      type: object
      allOf:
      - $ref: "#/components/schemas/AssetDatapointQuery"
      description: "Returns at most one numeric datapoint: the closest value at or\
        \ before the requested time. Use `fromTimestamp` as a Unix-seconds timestamp\
        \ at the HTTP API boundary. `toTimestamp`, `fromTime`, and `toTime` are ignored.\
        \ The equality boundary is inclusive."
    AssetDatapointQuery:
      type: object
      description: "Polymorphic historical-datapoint query. Select `all` to return\
        \ every value, `interval` to aggregate values into time buckets, `lttb` to\
        \ downsample a numeric or boolean series, or `nearest` to retrieve the last\
        \ value at or before a time."
      discriminator:
        mapping:
          all: "#/components/schemas/AssetDatapointAllQuery"
          interval: "#/components/schemas/AssetDatapointIntervalQuery"
          lttb: "#/components/schemas/AssetDatapointLTTBQuery"
          nearest: "#/components/schemas/AssetDatapointNearestQuery"
        propertyName: type
      properties:
        fromTime:
          type: string
          format: date-time
          description: "Inclusive lower range bound for `all`, `interval`, and `lttb`\
            \ as an ISO local or offset date-time. A local value is interpreted in\
            \ the server time zone; an offset value is converted to the server time\
            \ zone. Takes precedence over `fromTimestamp` and is ignored by `nearest`."
          example: 2026-01-01T00:00:00Z
        fromTimestamp:
          type: integer
          format: int64
          description: "Inclusive lower range bound as Unix time in milliseconds for\
            \ `all`, `interval`, and `lttb`; ignored when `fromTime` is supplied.\
            \ For `nearest` this is instead the requested time in Unix seconds and\
            \ is the only time field used."
          example: 1767225600000
        toTime:
          type: string
          format: date-time
          description: "Inclusive upper range bound for `all`, `interval`, and `lttb`\
            \ as an ISO local or offset date-time. A local value is interpreted in\
            \ the server time zone; an offset value is converted to the server time\
            \ zone. Takes precedence over `toTimestamp` and is ignored by `nearest`."
          example: 2026-01-02T00:00:00Z
        toTimestamp:
          type: integer
          format: int64
          description: "Inclusive upper range bound as Unix time in milliseconds for\
            \ `all`, `interval`, and `lttb`; ignored when `toTime` is supplied and\
            \ not used by `nearest`."
          example: 1767312000000
        type:
          type: string
      required:
      - type
