          type: integer
          format: int64
      - description: "Exclusive upper bound for the sent timestamp, in Unix milliseconds."
        example: 1767312000000
        in: query
        name: to
        schema:
          type: integer
          format: int64
      - description: Return notifications associated with this realm.
        example: building
        in: query
        name: realmId
        schema:
