        in: query
        name: id
        schema:
          type: integer
          format: int64
      - description: Notification message type discriminator.
        example: push
        in: query
        name: type
        schema:
          type: string
      - description: "Inclusive lower bound for the sent timestamp, in Unix milliseconds."
        example: 1767225600000
        in: query
