openapi: 3.0.1
info:
  contact:
    email: info@openremote.io
  description: "This is the documentation for the OpenRemote Manager HTTP API. The\
    \ `realm` server variable selects the request realm. Operations that show the\
    \ `openid` security requirement need an OAuth 2 access token; operations without\
    \ that requirement support anonymous access, although the returned data can still\
    \ be limited to public resources. Unless an operation documents another schema,\
    \ error responses use a plain-text body. Please see the [documentation](https://docs.openremote.io)\
    \ for more info."
  license:
    name: AGPL 3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  title: OpenRemote Manager HTTP API
  version: 3.0.0
servers:
- url: "https://demo.openremote.io/api/{realm}/"
  variables:
    realm:
      default: master
tags:
- description: "Create, query, maintain, and associate alarms with assets"
  name: Alarm
- description: Discover installed Manager applications and load their public client
    configuration
  name: UI Apps
- description: "Discover asset, attribute-value, and metadata types supported by this\
    \ Manager or a gateway"
  name: Asset Model
- description: "Query and manage assets, attributes, hierarchy, and user-to-asset\
    \ links"
  name: Asset
- description: Discover protocol instances and import or discover assets through Agent
    assets
  name: Agent
- description: Register mobile and browser consoles as Console assets
  name: Console
- description: Query public or accessible dashboards and manage dashboards for the
    Insights UI
  name: Dashboard
- description: Query and export historical values stored for asset attributes
  name: Asset Datapoint
- description: Read and replace predicted future values for asset attributes
  name: Asset Predicted Datapoint
- description: Configure this Manager's connections to central OpenRemote gateway
    services
  name: Gateway
- description: Read public Manager UI configuration and administer its configuration
    and images
  name: Configuration
- description: "Configure the Manager map and serve map styles, vector tiles, and\
    \ custom MBTiles data"
  name: Map
- description: "Send notifications and query, delete, deliver, or acknowledge their\
    \ delivery records"
  name: Notification
- description: Super-administrator operations for device provisioning configurations
  name: Provisioning
- description: "Inspect rule engines and query or manage global, realm, and asset\
    \ rulesets"
  name: Rule
- description: Discover the node definitions available to the visual flow-rules editor
  name: Flow
- description: Discover accessible realms and administer identity-provider realms
  name: Realm
- description: "Query and manage identity-provider users, roles, credentials, locale,\
    \ and live sessions"
  name: User
- description: "Register, discover, renew, and deregister leased external-service\
    \ instances"
  name: Services
- description: Query and clear stored Manager logs and maintain syslog storage settings
  name: Syslog
- description: Read Manager health and build information
  name: Status
paths:
  /agent/assetDiscovery/{agentId}:
    get:
      description: "Runs the agent protocol's asset discovery, waits up to ten seconds\
        \ for results, returns the discovered tree, and asynchronously persists discovered\
        \ assets below the agent."
      operationId: doProtocolAssetDiscovery
      parameters:
      - description: Agent asset that performs discovery.
        example: 7A6p4AnLTkKxJUCQAAABAA
        in: path
        name: agentId
        required: true
        schema:
          type: string
      - description: OpenRemote realm name. Non-super users are always restricted
          to their authenticated realm.
        example: building
        in: query
        name: realm
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetTreeNode"
          description: The request completed successfully
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The request parameters or body are invalid
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: The operation failed because of an unexpected server error
      security:
      - openid: []
      summary: Discover assets through an agent
      tags:
      - Agent
  /agent/assetImport/{agentId}:
    post:
      description: "Decodes the supplied FileInfo, asks the agent protocol to import\
        \ it, persists the returned asset tree below the agent, and returns that tree."
      operationId: doProtocolAssetImport
      parameters:
      - description: Agent asset that performs the import.
        example: 7A6p4AnLTkKxJUCQAAABAA
        in: path
        name: agentId
        required: true
        schema:
          type: string
      - description: OpenRemote realm name. Non-super users are always restricted
          to their authenticated realm.
        example: building
        in: query
        name: realm
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileInfo"
        description: File metadata and Base64 or text contents in the format understood
          by the selected agent protocol.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetTreeNode"
          description: The request completed successfully
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The request parameters or body are invalid
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
        "405":
          description: The selected agent protocol does not support asset import
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: The operation failed because of an unexpected server error
      security:
      - openid: []
      summary: Import assets through an agent
      tags:
      - Agent
  /agent/instanceDiscovery/{agentType}:
    get:
      description: Runs instance discovery for an agent type and returns candidate
        Agent assets. parentId selects local versus edge-gateway discovery; non-super
        users are always constrained to their authenticated realm.
      operationId: doProtocolInstanceDiscovery
      parameters:
      - description: Optional parent asset used to choose local or edge-gateway discovery.
        example: 7A6p4AnLTkKxJUCQAAABAA
        in: query
        name: parentId
        schema:
          type: string
      - description: Registered agent asset type whose protocol supports instance
          discovery.
        example: HTTPAgent
        in: path
        name: agentType
        required: true
        schema:
          type: string
      - description: OpenRemote realm name. Non-super users are always restricted
          to their authenticated realm.
        example: building
        in: query
        name: realm
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentObjectObjectObject"
          description: The request completed successfully
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The request parameters or body are invalid
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
        "415":
          description: The selected agent protocol does not support instance discovery
      security:
      - openid: []
      summary: Discover protocol instances
      tags:
      - Agent
  /alarm:
    delete:
      description: Permanently removes all alarms identified by the request body after
        verifying access to every alarm's realm.
      operationId: removeAlarms
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int64
        description: Numeric IDs of the alarms to remove.
        required: true
      responses:
        "204":
          description: The request completed successfully; no response body is returned
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The request parameters or body are invalid
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
      security:
      - openid: []
      summary: Remove alarms
      tags:
      - Alarm
    get:
      description: "Returns alarms in the requested accessible realm, optionally filtered\
        \ by status, linked asset, or assignee. When realm is omitted, the authenticated\
        \ realm is used."
      operationId: getAlarms
      parameters:
      - description: OpenRemote realm name. Defaults to the authenticated realm.
        example: building
        in: query
        name: realm
        schema:
          type: string
      - description: Alarm lifecycle status to match.
        example: OPEN
        in: query
        name: status
        schema:
          type: string
          enum:
          - OPEN
          - ACKNOWLEDGED
          - IN_PROGRESS
          - RESOLVED
          - CLOSED
      - description: Return alarms linked to this asset.
        example: 7A6p4AnLTkKxJUCQAAABAA
        in: query
        name: assetId
        schema:
          type: string
      - description: Return alarms assigned to this identity-provider user.
        example: 2f1c17e5-72b8-4dbe-9f8d-c49e66f82e10
        in: query
        name: assigneeId
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SentAlarm"
          description: The request completed successfully
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The request parameters or body are invalid
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
      security:
      - openid: []
      summary: Retrieve all alarms or a subset using filter criteria
      tags:
      - Alarm
    post:
      description: Creates a manual alarm in an accessible realm and optionally links
        it to the supplied asset IDs. The authenticated user or client becomes the
        alarm source.
      operationId: createAlarm
      parameters:
      - description: Asset IDs to link to the new alarm. Repeat the query parameter
          for multiple assets.
        example: 7A6p4AnLTkKxJUCQAAABAA
        explode: true
        in: query
        name: assetIds
        schema:
          type: array
          items:
            type: string
        style: form
      requestBody:
        content:
          application/json:
            examples:
              High temperature alarm:
                description: High temperature alarm
                summary: Create an open high-severity alarm
                value:
                  title: Temperature threshold exceeded
                  content: Boiler room temperature reached 42 °C.
                  severity: HIGH
                  status: OPEN
                  realm: building
            schema:
              $ref: "#/components/schemas/Alarm"
        description: Alarm to create. The source and sourceId are assigned from the
          authenticated caller.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentAlarm"
          description: The request completed successfully
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The request parameters or body are invalid
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
      security:
      - openid: []
      summary: Create an alarm
      tags:
      - Alarm
  /alarm/assets:
    put:
      description: |
        Adds links between assets and one existing alarm.

        The request body is a list for backward compatibility, but this operation now has single-alarm semantics:
        every item must contain the same `id.realm` and the same `id.alarmId`. The alarm must exist in that realm,
        every asset must exist in the same realm, and the authenticated user must have access to that realm. Requests
        containing mixed alarm IDs or realms are rejected as bad requests.

        Existing links are left unchanged; duplicate links in the request or links that already exist are ignored.
        This operation does not remove existing links from the alarm.
      operationId: setAssetLinks
      requestBody:
        content:
          application/json:
            examples:
              Invalid multiple alarms:
                description: Invalid multiple alarms
                summary: Rejected because the request targets more than one alarm
                value:
                - id:
                    realm: building
                    alarmId: 1234
                    assetId: 7A6p4AnLTkKxJUCQAAABAA
                - id:
                    realm: building
                    alarmId: 5678
                    assetId: 2Qjr4AnLTkKxJUCQAAACAA
              Multiple asset links:
                description: Multiple asset links
                summary: Link multiple assets to the same alarm
                value:
                - id:
                    realm: building
                    alarmId: 1234
                    assetId: 7A6p4AnLTkKxJUCQAAABAA
                - id:
                    realm: building
                    alarmId: 1234
                    assetId: 2Qjr4AnLTkKxJUCQAAACAA
              Single asset link:
                description: Single asset link
                summary: Link one asset to one alarm
                value:
                - id:
                    realm: building
                    alarmId: 1234
                    assetId: 7A6p4AnLTkKxJUCQAAABAA
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AlarmAssetLink"
        description: Alarm asset links to add. All items must use the same `id.realm`
          and `id.alarmId`.
        required: true
      responses:
        "204":
          description: The request completed successfully; no response body is returned
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The request parameters or body are invalid
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
      security:
      - openid: []
      summary: Add asset links to a single alarm
      tags:
      - Alarm
  /alarm/{alarmId}:
    delete:
      description: Permanently removes one alarm after verifying access to its realm.
      operationId: removeAlarm
      parameters:
      - description: Numeric alarm identifier.
        example: 1234
        in: path
        name: alarmId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: The request completed successfully; no response body is returned
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The request parameters or body are invalid
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
      security:
      - openid: []
      summary: Remove an alarm
      tags:
      - Alarm
    get:
      description: Returns one alarm when its realm is active and accessible to the
        authenticated user.
      operationId: getAlarm
      parameters:
      - description: Numeric alarm identifier.
        example: 1234
        in: path
        name: alarmId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentAlarm"
          description: The request completed successfully
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
      security:
      - openid: []
      summary: Retrieve an alarm
      tags:
      - Alarm
    put:
      description: Updates the mutable state of an existing alarm after verifying
        access to its current realm.
      operationId: updateAlarm
      parameters:
      - description: Numeric alarm identifier.
        example: 1234
        in: path
        name: alarmId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SentAlarm"
        description: Complete updated alarm state.
        required: true
      responses:
        "204":
          description: The request completed successfully; no response body is returned
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
      security:
      - openid: []
      summary: Update an alarm
      tags:
      - Alarm
  /alarm/{alarmId}/assets:
    get:
      description: Returns links from the alarm to assets in the explicitly supplied
        accessible realm.
      operationId: getAssetLinks
      parameters:
      - description: Numeric alarm identifier.
        example: 1234
        in: path
        name: alarmId
        required: true
        schema:
          type: integer
          format: int64
      - description: OpenRemote realm name.
        example: building
        in: query
        name: realm
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlarmAssetLink"
          description: The request completed successfully
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
      security:
      - openid: []
      summary: Retrieve the asset links of an alarm
      tags:
      - Alarm
  /apps:
    get:
      description: Returns the identifiers of applications installed in the Manager
        web root.
      operationId: getApps
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          description: The request completed successfully
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: The operation failed because of an unexpected server error
      summary: Retrieve a list of the available applications
      tags:
      - UI Apps
  /apps/consoleConfig:
    get:
      description: Loads the public console_config.json document used to configure
        console clients before sign-in.
      operationId: getConsoleConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The request completed successfully
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: The operation failed because of an unexpected server error
      summary: Retrieve the console configuration
      tags:
      - UI Apps
  /apps/info:
    get:
      description: Loads each installed application's info.json file and returns the
        documents keyed by application identifier.
      operationId: getAppInfos
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
          description: The request completed successfully
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: The operation failed because of an unexpected server error
      summary: Retrieve the info of the available applications
      tags:
      - UI Apps
  /asset:
    delete:
      description: "Permanently deletes every asset identified by repeated assetId\
        \ query parameters, subject to realm and restricted-user access rules."
      operationId: deleteAsset
      parameters:
      - description: Asset IDs to delete. Repeat the query parameter for multiple
          assets.
        example: 7A6p4AnLTkKxJUCQAAABAA
        explode: true
        in: query
        name: assetId
        required: true
        schema:
          type: array
          items:
            type: string
        style: form
      responses:
        "204":
          description: The request completed successfully; no response body is returned
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The request parameters or body are invalid
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
      security:
      - openid: []
      summary: Delete assets
      tags:
      - Asset
    post:
      description: Creates an asset in an accessible realm and returns the persisted
        representation. The server generates an ID when absent; supplied IDs must
        be globally unique and 22 characters long.
      operationId: createAsset
      requestBody:
        content:
          application/json:
            examples:
              Create a Thing asset:
                description: Create a Thing asset
                summary: Create a sensor with temperature and humidity attributes
                value:
                  type: ThingAsset
                  name: Boiler room sensor
                  realm: building
                  attributes:
                    temperature:
                      name: temperature
                      type: number
                      value: 21.5
                    humidity:
                      name: humidity
                      type: number
                      value: 48
            schema:
              $ref: "#/components/schemas/AssetObject"
        description: Asset to create. Omit id to let the server generate one; realm
          defaults to the authenticated realm.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetObject"
          description: The request completed successfully
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The request parameters or body are invalid
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Authentication is required or the supplied credentials are
            invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The authenticated user does not have permission to perform
            this operation
      security:
      - openid: []
      summary: Create an asset
      tags:
      - Asset
  /asset/attributes:
    put:
      description: Submits a batch of attribute states using current server time and
        returns one result per input item. Authorization and processing failures are
        encoded in each AttributeWriteResult rather than returned as an HTTP error.
      operationId: writeAttributeValues
      requestBody:
        content:
          application/json:
            examples:
              Write two attributes:
                description: Write two attributes
                summary: Update temperature and humidity on one asset
                value:
                - ref:
                    id: 7A6p4AnLTkKxJUCQAAABAA
                    name: temperature
                  value: 21.5
                - ref:
                    id: 7A6p4AnLTkKxJUCQAAABAA
                    name: humidity
                  value: 48
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AttributeState"
        description: Attribute references and values to write using the current server
          time.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttributeWriteResult"
          description: The request completed successfully
      summary: Write values to multiple asset attributes
      tags:
      - Asset
  /asset/attributes/timestamp:
    put:
      description: Submits a batch of complete attribute events and returns one result
        per input item. Supplied timestamps are preserved; authorization and processing
        failures are encoded per result rather than returned as an HTTP error.
      operationId: writeAttributeEvents
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AttributeEvent"
        description: "Complete attribute events to write, including their timestamps."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttributeWriteResult"
          description: The request completed successfully
      summary: Write timestamped values to multiple asset attributes
