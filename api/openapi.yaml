        in: query
        name: descending
        schema:
          type: boolean
      - description: Number of matching records to skip.
        example: 0
        in: query
        name: offset
        schema:
          type: integer
          format: int32
      - description: Maximum number of records to return.
        example: 100
        in: query
        name: limit
        schema:
          type: integer
          format: int32
