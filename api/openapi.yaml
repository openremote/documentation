  /asset/datapoint/{assetId}/{attributeName}:
    post:
      description: Returns stored historical values for one attribute. A null body
        returns the available series; a polymorphic query body controls the time range
        and retrieval or aggregation strategy. Anonymous access requires public-read
        access on both asset and attribute.
      operationId: getDatapoints
      parameters:
      - description: Globally unique 22-character asset identifier.
        example: 7A6p4AnLTkKxJUCQAAABAA
        in: path
        name: assetId
        required: true
        schema:
          type: string
      - description: Attribute name as defined by the asset model.
        example: temperature
        in: path
        name: attributeName
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              All values:
                description: All values
                summary: Return every datapoint in a one-day inclusive range
                value:
                  type: all
                  fromTime: 2026-01-01T00:00:00Z
                  toTime: 2026-01-02T00:00:00Z
              Hourly average:
                description: Hourly average
                summary: Average one day of values into hourly buckets and fill gaps
                value:
                  type: interval
                  fromTimestamp: 1767225600000
                  toTimestamp: 1767312000000
                  interval: 1 hour
                  formula: AVG
                  gapFill: true
              LTTB downsampling:
                description: LTTB downsampling
                summary: Downsample one day to at most 500 representative points
                value:
                  type: lttb
                  fromTimestamp: 1767225600000
                  toTimestamp: 1767312000000
                  amountOfPoints: 500
              Nearest value:
                description: Nearest value
                summary: Return the closest datapoint at or before a Unix-seconds
                  timestamp
                value:
                  type: nearest
                  fromTimestamp: 1767312000
            schema:
              oneOf:
              - $ref: "#/components/schemas/AssetDatapointAllQuery"
              - $ref: "#/components/schemas/AssetDatapointIntervalQuery"
              - $ref: "#/components/schemas/AssetDatapointLTTBQuery"
              - $ref: "#/components/schemas/AssetDatapointNearestQuery"
        description: "Optional polymorphic datapoint query. Set type to all, interval,\
          \ lttb, or nearest. Omit the body to return the available stored series."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValueDatapointObject"
          description: The request completed successfully
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The request parameters or body are invalid
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The caller does not have permission to access the requested
            resource
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The requested resource does not exist
        "413":
          content:
            text/plain:
              schema:
                type: string
          description: The request or generated response exceeds the configured size
            limit
      summary: Retrieve the historical datapoints of an asset attribute
      tags:
      - Asset Datapoint
